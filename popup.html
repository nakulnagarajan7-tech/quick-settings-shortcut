<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Quick Settings</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <h3>Quick Settings</h3>
  <div class="grid">
    <button data-url="chrome://settings/">General</button>
    <button data-url="chrome://settings/privacy">Privacy</button>
    <button data-url="chrome://settings/passwords">Passwords</button>
    <button data-url="chrome://settings/clearBrowserData">Clear Data</button>
    <button data-url="chrome://extensions/">Extensions</button>
    <button data-url="chrome://downloads/">Downloads</button>
  </div>
  <script src="popup.js"></script>
</body>
</html>
